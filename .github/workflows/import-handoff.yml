name: Import handoff resources

on:
  push:
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 -d > /tmp/mimic-handoff.tar.gz
          tar -xzf /tmp/mimic-handoff.tar.gz -C .
          rm -f resources/core-registry.json resources/registry.json
          python3 scripts/validate_repo.py
      - name: Commit imported pure-Skill resources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .bootstrap
          rm -f .github/workflows/import-handoff.yml
          git add -A
          git commit -m 'feat: import full MIMIC handoff resources into pure SQL skill'
          git push origin HEAD:main
